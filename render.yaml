# =============================================================================
# SaveRaks Render Blueprint (Infrastructure-as-Code)
# Deploys Static Site (web), Web Service (api), and Managed PostgreSQL (db)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. Frontend Web App (Static Site)
  # ---------------------------------------------------------------------------
  - type: web
    name: saveraks-web
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @saveraks/shared build && pnpm --filter @saveraks/web build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: saveraks-api
          property: host
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

  # ---------------------------------------------------------------------------
  # 2. Backend API (Web Service)
  # ---------------------------------------------------------------------------
  - type: web
    name: saveraks-api
    runtime: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @saveraks/shared build && cd apps/api && npx prisma generate && npx prisma migrate deploy
    startCommand: node apps/api/src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: saveraks-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STAFF_INVITE_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: saveraks-web
          property: host
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

# -----------------------------------------------------------------------------
# 3. Managed PostgreSQL Database
# -----------------------------------------------------------------------------
databases:
  - name: saveraks-db
    databaseName: saveraks
    user: saveraks_user
    plan: starter
